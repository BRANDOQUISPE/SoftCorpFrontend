<div class="asignar-container">

  <header class="header">
    <div>
      <h1>Soft Corporation</h1>
      <p>Panel del Jefe</p>
    </div>

    <button (click)="volver()">Volver</button>
  </header>

  <main class="content">

    <div class="page-title">
      <h2>Asignar incidencia</h2>
      <p>Asigne un incidente a uno de los técnicos disponibles.</p>
    </div>

    <div class="form-card">

      <div class="form-group">
        <label for="incidente">Incidencia</label>

        <select id="incidente">
          <option>INC-001 - Computadora no enciende</option>
          <option>INC-002 - Problema de conexión a Internet</option>
          <option>INC-003 - Error en sistema operativo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tecnico">Técnico</label>

        <select id="tecnico">
          <option>Juan Pérez</option>
          <option>Ana Torres</option>
          <option>Carlos López</option>
        </select>
      </div>

      <button class="assign-button" (click)="asignar()">
        Asignar incidencia
      </button>

      @if (mensaje) {
        <p class="mensaje">{{ mensaje }}</p>
      }

    </div>

  </main>

</div>
