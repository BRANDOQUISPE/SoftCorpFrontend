<div class="disponibilidad-container">

  <header class="header">
    <div>
      <h1>SoftCorp</h1>
      <p>Panel del Jefe</p>
    </div>

    <button (click)="volver()">Volver</button>
  </header>

  <main class="content">

    <div class="page-title">
      <h2>Disponibilidad de técnicos</h2>
      <p>Consulte qué técnicos se encuentran disponibles para atender incidentes.</p>
    </div>

    <div class="technicians">

      <div class="technician-card">
        <div class="icon">👨‍🔧</div>

        <div class="technician-info">
          <h3>Juan Pérez</h3>
          <p>Especialidad: Hardware</p>
        </div>

        <span class="status available">Disponible</span>
      </div>

      <div class="technician-card">
        <div class="icon">👨‍💻</div>

        <div class="technician-info">
          <h3>Carlos López</h3>
          <p>Especialidad: Redes</p>
        </div>

        <span class="status busy">Ocupado</span>
      </div>

      <div class="technician-card">
        <div class="icon">👩‍💻</div>

        <div class="technician-info">
          <h3>Ana Torres</h3>
          <p>Especialidad: Software</p>
        </div>

        <span class="status available">Disponible</span>
      </div>

    </div>

  </main>

</div>
